<script>
/* ============================================================
   CRAFT WONDER DASHBOARD — 在庫（SCM）
   ------------------------------------------------------------
   データ取得はGAS、集計・描画はここ（引き継ぎ書 §2.5）。
   Styles.html は営業ページと共有する（§22）。
   ============================================================ */
(function () {
'use strict';

var C = {
  gold: '#B39A63', goldDark: '#8D7544', goldSoft: '#F1EDE4',
  silver: '#A8AAAD', silverSoft: '#EEEEEC',
  ink: '#171717', muted: '#747474', line: '#D8D8D4',
  alert: '#875D55'
};

var SERIES = [C.gold, C.ink, C.silver, C.goldDark, '#CBB88C', '#5A5A5A', '#E2D6B8', '#D5D6D7'];

/** 在庫日数の帯。しきい値はサーバ側の Config から受け取って差し替える。 */
var DOS_BANDS = [
  { key: 'low',      label: '要補充' },
  { key: 'healthy',  label: '適正' },
  { key: 'excess',   label: '過剰' },
  { key: 'dead',     label: '大幅過剰' },
  { key: 'noOut',    label: '出庫なし' },
  { key: 'unknown',  label: '単価未突合' }
];

var EXPIRY_BANDS = [
  { key: 'expired', label: '期限切れ' },
  { key: 'd30',     label: '30日以内' },
  { key: 'd90',     label: '90日以内' },
  { key: 'd180',    label: '180日以内' },
  { key: 'over',    label: '181日以上' },
  { key: 'none',    label: '期限なし' }
];

var FILTER_KEYS = ['itemType', 'category', 'product', 'status', 'expiry', 'supplier', 'site'];
var FILTER_LABELS = {
  itemType: '品目区分', category: 'カテゴリ', product: '商品',
  status: 'ステータス', expiry: '期限', supplier: '仕入先', site: '拠点'
};

var DATA = null;
var TODAY = null;          // 残日数・滞留日数の基準日（今日）
var FRESH = null;          // 在庫データの鮮度＝最終入庫日の最大値
var TH = {};               // しきい値
var state = { multi: {} };
FILTER_KEYS.forEach(function (k) { state.multi[k] = new Set(); });

// ---------------------------------------------------------------------------
// ユーティリティ
// ---------------------------------------------------------------------------

function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function yen(n) { return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }
function num(n) { return Math.round(n || 0).toLocaleString('ja-JP'); }
function compactYen(v) {
  var a = Math.abs(v);
  if (a >= 1000000) return '¥' + (v / 1000000).toFixed(1) + 'M';
  if (a >= 1000) return '¥' + Math.round(v / 1000) + 'k';
  return '¥' + Math.round(v);
}
function dateObj(s) { return s ? new Date(s + 'T00:00:00') : null; }
function fmtDate(s) {
  if (!s) return '—';
  var p = s.split('-');
  return p[0].slice(2) + '/' + p[1] + '/' + p[2];
}
function daysBetween(a, b) {
  var x = dateObj(a), y = dateObj(b);
  if (!x || !y) return null;
  return Math.round((y - x) / 86400000);
}
function sum(arr, f) { var s = 0; for (var i = 0; i < arr.length; i++) s += f(arr[i]); return s; }
function shortName(p) {
  var s = String(p || '')
    .replace(/^[★■▲●]+/, '')
    .replace(/^●[^●]*●/, '')
    .replace(/\s+/g, ' ')
    .trim();
  return s;
}

// ---------------------------------------------------------------------------
// 取得
// ---------------------------------------------------------------------------

function loadData() {
  if (window.__CW_PREVIEW_DATA__) {
    setTimeout(function () { onData(window.__CW_PREVIEW_DATA__); }, 0);
    return;
  }
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .getDashboardData({ page: 'inventory' });
}

function onError(err) {
  $('loading').hidden = true;
  $('errorSlot').innerHTML =
    '<div class="errorBox"><b>データを取得できませんでした</b>' +
    esc(err && err.message ? err.message : err) +
    '<br>Spreadsheet に RAW_Inventory シートがあるか、列名が docs/cw-dashboard-inventory.md の定義と' +
    '一致しているか確認してください。</div>';
}

function onData(payload) {
  DATA = payload;
  TH = payload.meta.thresholds;

  // 残日数・滞留日数は「今日」を基準にする。
  // 在庫データの最新日を基準にすると、今日すでに期限切れのロットが
  // 期限内として表示され、現場の判断を誤らせるため。
  var now = new Date();
  TODAY = now.getFullYear() + '-' +
    ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
    ('0' + now.getDate()).slice(-2);

  // データがどれだけ古いかは別に示す。
  var stamps = payload.rows
    .map(function (r) { return r.lastIn || r.arrivedOn; })
    .filter(Boolean)
    .sort();
  FRESH = stamps.length ? stamps[stamps.length - 1] : '';

  enrich();
  $('loading').hidden = true;
  $('content').hidden = false;
  initHeader();
  initFilters();
  bindEvents();
  render();
}

/** 各ロットに、期限・滞留・金額といった派生値を持たせる。 */
function enrich() {
  DATA.rows.forEach(function (r) {
    r.value = r.hasCost ? r.stock * r.unitCost : 0;
    r.freeValue = r.hasCost ? r.free * r.unitCost : 0;
    r.expiryDays = r.bestBefore ? daysBetween(TODAY, r.bestBefore) : null;
    r.expiryBand = expiryBandOf(r.expiryDays);
    r.idleDays = r.lastOut ? daysBetween(r.lastOut, TODAY) : null;
    var d = DATA.demand[r.sku];
    r.dailyOut = d ? d.dailyOut : 0;
    r.lastOrder = d ? d.lastOrder : '';
  });
}

function expiryBandOf(days) {
  if (days === null) return 'none';
  if (days < 0) return 'expired';
  if (days <= 30) return 'd30';
  if (days <= 90) return 'd90';
  if (days <= 180) return 'd180';
  return 'over';
}

/** SKU単位の在庫日数から状態を決める。 */
function statusOf(p) {
  if (!p.hasCost) return 'unknown';
  if (!p.dailyOut) return 'noOut';
  if (p.dos === null) return 'unknown';
  if (p.dos < TH.low) return 'low';
  if (p.dos <= TH.healthy) return 'healthy';
  if (p.dos <= TH.excess) return 'excess';
  return 'dead';
}

function statusLabel(key) {
  for (var i = 0; i < DOS_BANDS.length; i++) {
    if (DOS_BANDS[i].key === key) return DOS_BANDS[i].label;
  }
  return key;
}

function statusBadge(key) {
  var cls = (key === 'low' || key === 'dead') ? ' flag'
    : (key === 'noOut' || key === 'unknown') ? ' silver' : '';
  return '<span class="badge' + cls + '">' + esc(statusLabel(key)) + '</span>';
}

// ---------------------------------------------------------------------------
// Header
// ---------------------------------------------------------------------------

function initHeader() {
  var m = DATA.meta;
  $('eyebrow').textContent = m.eyebrow;
  $('pageTitle').textContent = m.title;
  $('generatedAt').textContent = m.generatedAt;
  var lag = FRESH ? daysBetween(FRESH, TODAY) : null;
  $('scopeLabel').innerHTML =
    num(m.lotCount) + 'ロット / ' + num(m.skuCount) + 'SKU' +
    (FRESH
      ? '<br><span style="font-weight:400">最終入庫 ' + fmtDate(FRESH) +
        (lag !== null && lag > 7 ? '（' + lag + '日前のデータ）' : '') + '</span>'
      : '');
  $('coverage').textContent =
    (m.demandFrom || '—') + ' 〜 ' + (m.demandTo || '—') + '（' + m.demandDays + '日）';

  $('kpiExpiringNote').textContent = '残日数 ' + TH.expirySoon + '日以内';
  $('kpiLowNote').textContent = '在庫日数 ' + TH.low + '日未満';
  $('kpiExcessNote').textContent = '在庫日数 ' + TH.healthy + '日超';
  $('kpiStagnantNote').textContent = '最終出庫から ' + TH.stagnant + '日超';

  var notes = [
    '※ <b>在庫金額 = 在庫数 × 購入価格</b>（原価ベース）。購入価格は受注データ側の値を' +
    '<b>SKU（在庫保管単位）＝ 在庫側の商品コード</b>で突き合わせて取得しています。' +
    '商品名は在庫側と受注側で表記が異なるため突合キーには使っていません。',
    '※ <b>在庫日数 = 有効在庫 ÷ 日次平均出庫</b>。日次平均出庫は受注データ' +
    '（' + esc(m.demandFrom) + '〜' + esc(m.demandTo) + '・' + m.demandDays + '日）の発注数から算出しています。' +
    '出庫実績が無いSKUは在庫日数を出さず「出庫なし」と表示します。',
    '※ <b>有効在庫 = 未引当数</b>。引当済みは出荷待ちで確保されている分です。',
    '※ 賞味期限の残日数と滞留日数は<b>今日（' + fmtDate(TODAY) + '）</b>を基準に計算しています。' +
    '在庫データの最終入庫日は ' + fmtDate(FRESH) + ' です' +
    (FRESH && daysBetween(FRESH, TODAY) > 7
      ? '（<b>' + daysBetween(FRESH, TODAY) + '日前</b>のエクスポートのため、最新の入出庫が反映されていない可能性があります）'
      : '') + '。',
    '※ 在庫金額は<b>単価が突き合った商品のみ</b>の合計です。未突合の商品は数量だけ集計します。'
  ];
  (m.warnings || []).forEach(function (w) { notes.push('※ ' + esc(w)); });
  notes.push('※ 読込元 <b>' + esc(m.sheet) + '</b>（' + num(m.sourceRows) + '行）');
  $('footer').innerHTML = notes.join('<br>');

  renderMatchBanner(m);
}

function renderMatchBanner(m) {
  var slot = $('matchBanner');
  if (m.matchedSkus >= m.skuCount) {
    slot.innerHTML = '<div class="noticeBox">在庫の全 <b>' + m.skuCount +
      ' SKU</b> が受注データと突き合っており、在庫金額・在庫日数を算出できています。</div>';
    return;
  }
  var miss = m.skuCount - m.matchedSkus;
  slot.innerHTML = '<div class="noticeBox warn">受注データと突き合ったのは <b>' +
    m.matchedSkus + ' / ' + m.skuCount + ' SKU</b>。' +
    '残り <b>' + miss + ' SKU</b> は単価が取れないため<b>在庫金額と在庫日数を算出していません</b>' +
    '（数量は集計しています）。SKUが受注側に存在しない資材・ノベルティが該当します。</div>';
}

// ---------------------------------------------------------------------------
// Filter
// ---------------------------------------------------------------------------

function initFilters() {
  FILTER_KEYS.forEach(function (key) { buildMulti(key); });
}

/** 状態・期限はデータから算出する軸なので、候補もここで作る。 */
function optionsFor(key) {
  if (key === 'status') {
    var byStatus = {};
    productRows(DATA.rows).forEach(function (p) { byStatus[p.status] = (byStatus[p.status] || 0) + 1; });
    return DOS_BANDS
      .filter(function (b) { return byStatus[b.key]; })
      .map(function (b) { return { value: b.label, count: byStatus[b.key] }; });
  }
  if (key === 'expiry') {
    var byBand = {};
    DATA.rows.forEach(function (r) { byBand[r.expiryBand] = (byBand[r.expiryBand] || 0) + 1; });
    return EXPIRY_BANDS
      .filter(function (b) { return byBand[b.key]; })
      .map(function (b) { return { value: b.label, count: byBand[b.key] }; });
  }
  return (DATA.options && DATA.options[key]) || [];
}

function buildMulti(key) {
  var menu = $(key + 'Menu');
  var wrap = $(key + 'Multi');
  if (!menu || !wrap) return;

  var options = optionsFor(key);
  var searchable = options.length > 12;

  menu.innerHTML =
    '<div class="multiMenuHead">' +
      '<button type="button" class="multiMini" data-action="all">すべて</button>' +
      '<button type="button" class="multiMini" data-action="clear">解除</button>' +
      (searchable ? '<input type="search" class="multiSearch" placeholder="絞り込み" aria-label="選択肢を絞り込み">' : '') +
    '</div>' +
    options.map(function (o) {
      return '<label class="multiOption" data-value="' + esc(o.value) + '">' +
        '<input type="checkbox" value="' + esc(o.value) + '">' +
        '<span>' + esc(shortName(o.value)) + '</span>' +
        '<span class="optCount">' + num(o.count) + '</span></label>';
    }).join('');

  menu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var set = state.multi[key];
      if (cb.checked) set.add(cb.value); else set.delete(cb.value);
      cb.closest('.multiOption').classList.toggle('on', cb.checked);
      updateMultiLabel(key);
      render();
    });
  });

  menu.querySelectorAll('.multiMini').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var all = btn.getAttribute('data-action') === 'all';
      state.multi[key] = new Set(all ? options.map(function (o) { return o.value; }) : []);
      menu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
        cb.checked = all;
        cb.closest('.multiOption').classList.toggle('on', all);
      });
      updateMultiLabel(key);
      render();
    });
  });

  var search = menu.querySelector('.multiSearch');
  if (search) {
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      menu.querySelectorAll('.multiOption').forEach(function (opt) {
        var v = opt.getAttribute('data-value').toLowerCase();
        opt.style.display = (!q || v.indexOf(q) >= 0) ? '' : 'none';
      });
    });
    search.addEventListener('click', function (e) { e.stopPropagation(); });
  }

  var trigger = wrap.querySelector('.multiTrigger');
  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    document.querySelectorAll('.multiSelect.open').forEach(function (x) {
      if (x !== wrap) {
        x.classList.remove('open');
        x.querySelector('.multiTrigger').setAttribute('aria-expanded', 'false');
      }
    });
    var open = wrap.classList.toggle('open');
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.addEventListener('click', function (e) { e.stopPropagation(); });
  updateMultiLabel(key);
}

function updateMultiLabel(key) {
  var wrap = $(key + 'Multi');
  if (!wrap) return;
  var trigger = wrap.querySelector('.multiTrigger');
  var set = state.multi[key];
  var total = optionsFor(key).length;
  var label = FILTER_LABELS[key];

  if (set.size === 0 || set.size === total) {
    trigger.innerHTML = esc(label) + '：すべて';
    wrap.classList.remove('picked');
  } else if (set.size === 1) {
    trigger.innerHTML = esc(label) + '：' + esc(shortName(Array.from(set)[0]));
    wrap.classList.add('picked');
  } else {
    trigger.innerHTML = esc(label) + '<span class="multiCount">' + set.size + '</span>';
    wrap.classList.add('picked');
  }
}

function resetFilters() {
  FILTER_KEYS.forEach(function (key) {
    state.multi[key].clear();
    var menu = $(key + 'Menu');
    if (menu) {
      menu.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
        cb.checked = false;
        cb.closest('.multiOption').classList.remove('on');
      });
      var s = menu.querySelector('.multiSearch');
      if (s) { s.value = ''; menu.querySelectorAll('.multiOption').forEach(function (o) { o.style.display = ''; }); }
    }
    updateMultiLabel(key);
  });
  $('hideZero').value = '0';
  $('productSort').value = 'value_desc';
  $('lotSort').value = 'expiry_asc';
  render();
}

// ---------------------------------------------------------------------------
// 絞り込み
// ---------------------------------------------------------------------------

function expiryLabelOf(band) {
  for (var i = 0; i < EXPIRY_BANDS.length; i++) {
    if (EXPIRY_BANDS[i].key === band) return EXPIRY_BANDS[i].label;
  }
  return band;
}

function currentLots() {
  var hideZero = $('hideZero').value === '1';

  // ステータスはSKU単位で決まるので、先にSKU→状態の対応を作る。
  var statusBySku = {};
  productRows(DATA.rows).forEach(function (p) { statusBySku[p.sku] = statusLabel(p.status); });

  return DATA.rows.filter(function (r) {
    if (hideZero && r.stock <= 0) return false;
    for (var i = 0; i < FILTER_KEYS.length; i++) {
      var key = FILTER_KEYS[i];
      var set = state.multi[key];
      if (!set.size) continue;
      var v = key === 'status' ? statusBySku[r.sku]
        : key === 'expiry' ? expiryLabelOf(r.expiryBand)
        : r[key];
      if (!set.has(v)) return false;
    }
    return true;
  });
}

// ---------------------------------------------------------------------------
// SKU単位への集約
// ---------------------------------------------------------------------------

function productRows(lots) {
  var map = new Map();
  lots.forEach(function (r) {
    if (!map.has(r.sku)) {
      map.set(r.sku, {
        sku: r.sku, product: r.product, category: r.category, itemType: r.itemType,
        supplier: r.supplier, hasCost: r.hasCost, unitCost: r.unitCost,
        dailyOut: r.dailyOut, lastOrder: r.lastOrder,
        stock: 0, allocated: 0, free: 0, value: 0, lots: 0,
        nearestExpiry: '', lastIn: '', lastOut: ''
      });
    }
    var p = map.get(r.sku);
    p.stock += r.stock;
    p.allocated += r.allocated;
    p.free += r.free;
    p.value += r.value;
    p.lots++;
    if (r.bestBefore && (!p.nearestExpiry || r.bestBefore < p.nearestExpiry)) p.nearestExpiry = r.bestBefore;
    if (r.lastIn && r.lastIn > p.lastIn) p.lastIn = r.lastIn;
    if (r.lastOut && r.lastOut > p.lastOut) p.lastOut = r.lastOut;
  });

  return Array.from(map.values()).map(function (p) {
    p.dos = (p.hasCost && p.dailyOut > 0) ? p.free / p.dailyOut : null;
    p.expiryDays = p.nearestExpiry ? daysBetween(TODAY, p.nearestExpiry) : null;
    p.idleDays = p.lastOut ? daysBetween(p.lastOut, TODAY) : null;
    p.status = statusOf(p);
    return p;
  });
}

// ---------------------------------------------------------------------------
// KPI
// ---------------------------------------------------------------------------

function renderKpis(lots, products) {
  $('kpiValue').textContent = yen(sum(lots, function (r) { return r.value; }));
  $('kpiStock').textContent = num(sum(lots, function (r) { return r.stock; }));
  $('kpiFree').textContent = num(sum(lots, function (r) { return r.free; }));
  $('kpiAllocated').textContent = num(sum(lots, function (r) { return r.allocated; }));
  $('kpiSkus').textContent = num(products.length);
  $('kpiLots').textContent = num(lots.length);

  // 平均在庫日数は単純平均だと極端値に引きずられるので、
  // 「有効在庫合計 ÷ 日次出庫合計」の加重平均で出す。
  var withOut = products.filter(function (p) { return p.dailyOut > 0 && p.hasCost; });
  var freeSum = sum(withOut, function (p) { return p.free; });
  var outSum = sum(withOut, function (p) { return p.dailyOut; });
  $('kpiDos').textContent = outSum > 0 ? num(freeSum / outSum) + '日' : '—';

  $('kpiExpired').textContent = num(lots.filter(function (r) { return r.expiryBand === 'expired'; }).length) + 'ロット';
  $('kpiExpiring').textContent = num(lots.filter(function (r) {
    return r.expiryDays !== null && r.expiryDays >= 0 && r.expiryDays <= TH.expirySoon;
  }).length) + 'ロット';

  $('kpiLow').textContent = num(products.filter(function (p) { return p.status === 'low'; }).length);
  $('kpiExcess').textContent = num(products.filter(function (p) {
    return p.status === 'excess' || p.status === 'dead';
  }).length);
  $('kpiStagnant').textContent = num(products.filter(function (p) {
    return p.idleDays !== null && p.idleDays > TH.stagnant;
  }).length);
  $('kpiNoOut').textContent = num(products.filter(function (p) { return p.status === 'noOut'; }).length);
  $('kpiUnmatched').textContent = num(products.filter(function (p) { return !p.hasCost; }).length);
}

// ---------------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------------

function renderValueChart(lots) {
  var svg = $('valueChart');
  var map = new Map();
  lots.forEach(function (r) {
    map.set(r.category, (map.get(r.category) || 0) + r.value);
  });
  var arr = Array.from(map.entries())
    .map(function (e) { return { name: e[0], value: e[1] }; })
    .filter(function (x) { return x.value > 0; })
    .sort(function (a, b) { return b.value - a.value; });
  var total = sum(arr, function (x) { return x.value; });

  if (!total) {
    svg.innerHTML = '<text x="160" y="115" text-anchor="middle" font-size="12" fill="' + C.muted + '">在庫金額を算出できる商品がありません</text>';
    $('valueLegend').innerHTML = '';
    return;
  }

  var cx = 160, cy = 108, rO = 84, rI = 52, angle = -Math.PI / 2;
  var out = [];
  arr.forEach(function (x, i) {
    var frac = x.value / total;
    var a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var p = function (r, a) { return (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2); };
    var d = (frac >= 0.9999)
      ? 'M ' + (cx - rO) + ' ' + cy + ' a ' + rO + ' ' + rO + ' 0 1 0 ' + (rO * 2) + ' 0 a ' + rO + ' ' + rO + ' 0 1 0 ' + (-rO * 2) + ' 0 Z ' +
        'M ' + (cx - rI) + ' ' + cy + ' a ' + rI + ' ' + rI + ' 0 1 1 ' + (rI * 2) + ' 0 a ' + rI + ' ' + rI + ' 0 1 1 ' + (-rI * 2) + ' 0 Z'
      : 'M ' + p(rO, a0) + ' A ' + rO + ' ' + rO + ' 0 ' + large + ' 1 ' + p(rO, a1) +
        ' L ' + p(rI, a1) + ' A ' + rI + ' ' + rI + ' 0 ' + large + ' 0 ' + p(rI, a0) + ' Z';
    out.push('<path d="' + d + '" fill="' + SERIES[i % SERIES.length] + '" fill-rule="evenodd" stroke="#fff" stroke-width="1.5"><title>' +
      esc(x.name + '：' + yen(x.value) + '（' + (frac * 100).toFixed(1) + '%）') + '</title></path>');
  });
  out.push('<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="10" fill="' + C.muted + '">在庫金額 計</text>');
  out.push('<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + C.ink + '">' + esc(compactYen(total)) + '</text>');
  svg.innerHTML = out.join('');

  $('valueLegend').innerHTML = arr.map(function (x, i) {
    return '<span><i class="dot" style="background:' + SERIES[i % SERIES.length] + '"></i>' +
      esc(x.name) + ' <b class="num">' + (x.value / total * 100).toFixed(1) + '%</b></span>';
  }).join('');
}

/** 汎用の2軸縦棒（棒＝金額/数量、点線＝件数）。 */
function comboChart(svg, bands, W, H) {
  var pad = { l: 46, r: 34, t: 16, b: 52 };
  if (!bands.length) {
    svg.innerHTML = '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="12" fill="' + C.muted + '">対象データがありません</text>';
    return;
  }
  var innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  var maxA = Math.max(1, Math.max.apply(null, bands.map(function (b) { return b.amount; })));
  var maxC = Math.max(1, Math.max.apply(null, bands.map(function (b) { return b.count; })));
  var step = innerW / bands.length;
  var barW = Math.max(8, Math.min(30, step * 0.5));
  var cx = function (i) { return pad.l + step * (i + 0.5); };
  var ya = function (v) { return pad.t + innerH * (1 - v / maxA); };
  var yc = function (v) { return pad.t + innerH * (1 - v / maxC); };

  var out = [];
  [0, 0.5, 1].forEach(function (t) {
    var y = pad.t + innerH * t;
    out.push('<line x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '" stroke="' + C.line + '"/>');
    out.push('<text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="9" fill="' + C.muted + '">' +
      esc(bands[0].fmt(maxA * (1 - t))) + '</text>');
  });

  bands.forEach(function (b, i) {
    out.push('<rect x="' + (cx(i) - barW / 2) + '" y="' + ya(b.amount) + '" width="' + barW +
      '" height="' + Math.max(0, pad.t + innerH - ya(b.amount)) + '" fill="' +
      (b.alert ? C.alert : C.gold) + '"><title>' + esc(b.label + '：' + b.fmt(b.amount)) + '</title></rect>');
  });

  var pts = bands.map(function (b, i) { return cx(i) + ',' + yc(b.count); }).join(' ');
  out.push('<polyline points="' + pts + '" fill="none" stroke="' + C.ink + '" stroke-width="2"/>');
  bands.forEach(function (b, i) {
    out.push('<circle cx="' + cx(i) + '" cy="' + yc(b.count) + '" r="3" fill="#fff" stroke="' + C.ink + '" stroke-width="2"><title>' +
      esc(b.label + '：' + num(b.count) + b.countUnit) + '</title></circle>');
    out.push('<text x="' + cx(i) + '" y="' + (H - 30) + '" text-anchor="end" font-size="9" fill="' + C.muted +
      '" transform="rotate(-38 ' + cx(i) + ' ' + (H - 30) + ')">' + esc(b.label) + '</text>');
  });
  svg.innerHTML = out.join('');
}

function renderDosChart(products) {
  var bands = DOS_BANDS.map(function (b) {
    var hit = products.filter(function (p) { return p.status === b.key; });
    return {
      label: b.label,
      count: hit.length,
      countUnit: 'SKU',
      amount: sum(hit, function (p) { return p.value; }),
      alert: b.key === 'low' || b.key === 'dead',
      fmt: compactYen
    };
  }).filter(function (b) { return b.count > 0; });
  comboChart($('dosChart'), bands, 360, 230);
}

function renderExpiryChart(lots) {
  var bands = EXPIRY_BANDS.filter(function (b) { return b.key !== 'none'; }).map(function (b) {
    var hit = lots.filter(function (r) { return r.expiryBand === b.key; });
    return {
      label: b.label,
      count: hit.length,
      countUnit: 'ロット',
      amount: sum(hit, function (r) { return r.stock; }),
      alert: b.key === 'expired' || b.key === 'd30',
      fmt: function (v) { return num(v); }
    };
  }).filter(function (b) { return b.count > 0; });
  comboChart($('expiryChart'), bands, 360, 230);
}

// ---------------------------------------------------------------------------
// Operating signals
// ---------------------------------------------------------------------------

function renderInsights(lots, products) {
  var items = [];

  var expired = lots.filter(function (r) { return r.expiryBand === 'expired'; });
  if (expired.length) {
    items.push({
      flag: true,
      title: '賞味期限切れ',
      body: '<span class="metric">' + expired.length + 'ロット / ' +
        num(sum(expired, function (r) { return r.stock; })) + '点</span>（' +
        yen(sum(expired, function (r) { return r.value; })) + '）が期限切れです。廃棄・値引き処理の要否を確認してください。'
    });
  }

  var soon = lots.filter(function (r) {
    return r.expiryDays !== null && r.expiryDays >= 0 && r.expiryDays <= TH.expirySoon;
  }).sort(function (a, b) { return a.expiryDays - b.expiryDays; });
  if (soon.length) {
    items.push({
      flag: soon[0].expiryDays <= 30,
      title: '期限接近',
      body: '<span class="metric">' + soon.length + 'ロット</span>が残り' + TH.expirySoon + '日以内。最短は ' +
        esc(shortName(soon[0].product)) + ' の<span class="metric">残' + soon[0].expiryDays + '日</span>（' +
        fmtDate(soon[0].bestBefore) + '）です。'
    });
  }

  var low = products.filter(function (p) { return p.status === 'low'; })
    .sort(function (a, b) { return a.dos - b.dos; });
  if (low.length) {
    items.push({
      flag: true,
      title: '要補充',
      body: '在庫日数が' + TH.low + '日未満のSKUが <span class="metric">' + low.length + '件</span>。最短は ' +
        esc(shortName(low[0].product)) + ' の<span class="metric">' + low[0].dos.toFixed(0) + '日</span>' +
        '（有効在庫 ' + num(low[0].free) + ' / 日次出庫 ' + low[0].dailyOut.toFixed(1) + '）です。'
    });
  }

  var dead = products.filter(function (p) { return p.status === 'dead'; })
    .sort(function (a, b) { return b.value - a.value; });
  if (dead.length) {
    items.push({
      flag: true,
      title: '大幅過剰',
      body: '在庫日数が' + TH.excess + '日超のSKUが <span class="metric">' + dead.length + '件</span>、金額で' +
        '<span class="metric">' + yen(sum(dead, function (p) { return p.value; })) + '</span>。' +
        '最大は ' + esc(shortName(dead[0].product)) + '（' + yen(dead[0].value) + ' / ' +
        (dead[0].dos > 3650 ? '10年超' : dead[0].dos.toFixed(0) + '日') + '）です。'
    });
  }

  var noOut = products.filter(function (p) { return p.status === 'noOut'; });
  if (noOut.length) {
    items.push({
      title: '出庫実績なし',
      body: '受注データの期間内に出庫が無いSKUが <span class="metric">' + noOut.length + '件</span>、' +
        '金額で ' + yen(sum(noOut, function (p) { return p.value; })) + '。' +
        '新規投入品か、動いていない在庫かの切り分けが必要です。'
    });
  }

  var unmatched = products.filter(function (p) { return !p.hasCost; });
  if (unmatched.length) {
    items.push({
      title: '単価が突き合わない商品',
      body: '<span class="metric">' + unmatched.length + 'SKU</span>（' +
        num(sum(unmatched, function (p) { return p.stock; })) + '点）は受注データにSKUが無く、' +
        '在庫金額・在庫日数を算出していません。資材・ノベルティが中心です。'
    });
  }

  if (!items.length) {
    items.push({ title: '注目点なし', body: '現在の絞り込み条件では、期限・補充・過剰いずれのアラートもありません。' });
  }

  $('insights').innerHTML = items.map(function (x) {
    return '<div class="insight' + (x.flag ? ' flag' : '') + '"><b>' + esc(x.title) + '</b><p>' + x.body + '</p></div>';
  }).join('');
}

// ---------------------------------------------------------------------------
// Tables
// ---------------------------------------------------------------------------

function sortProducts(arr) {
  var mode = $('productSort').value;
  var copy = arr.slice();
  var far = function (v) { return v === null ? Infinity : v; };
  var neg = function (v) { return v === null ? -Infinity : v; };
  switch (mode) {
    case 'stock_desc': return copy.sort(function (a, b) { return b.stock - a.stock; });
    case 'dos_desc': return copy.sort(function (a, b) { return neg(b.dos) - neg(a.dos); });
    case 'dos_asc': return copy.sort(function (a, b) { return far(a.dos) - far(b.dos); });
    case 'expiry_asc': return copy.sort(function (a, b) { return far(a.expiryDays) - far(b.expiryDays); });
    case 'lastout_asc': return copy.sort(function (a, b) {
      return (b.idleDays === null ? -Infinity : b.idleDays) - (a.idleDays === null ? -Infinity : a.idleDays);
    });
    case 'name_asc': return copy.sort(function (a, b) { return a.product.localeCompare(b.product, 'ja'); });
    default: return copy.sort(function (a, b) { return b.value - a.value || b.stock - a.stock; });
  }
}

function renderProducts(products) {
  var arr = sortProducts(products);

  $('productBody').innerHTML = arr.map(function (p) {
    var dos = p.dos === null ? '—'
      : (p.dos > 3650 ? '10年超' : num(p.dos) + '日');
    var expiry = p.nearestExpiry
      ? fmtDate(p.nearestExpiry) + (p.expiryDays !== null
        ? ' <span class="badge' + (p.expiryDays < 0 ? ' flag' : p.expiryDays <= TH.expirySoon ? '' : ' silver') + '">' +
          (p.expiryDays < 0 ? '期限切れ' : '残' + p.expiryDays + '日') + '</span>'
        : '')
      : '—';
    var lastOut = p.lastOut
      ? fmtDate(p.lastOut) + (p.idleDays !== null && p.idleDays > TH.stagnant
        ? ' <span class="badge flag">' + p.idleDays + '日</span>' : '')
      : '—';
    return '<tr>' +
      '<td class="name" title="' + esc(p.product) + '">' + esc(shortName(p.product)) + '</td>' +
      '<td>' + esc(p.category) + '</td>' +
      '<td class="n">' + num(p.stock) + '</td>' +
      '<td class="n">' + num(p.allocated) + '</td>' +
      '<td class="n">' + num(p.free) + '</td>' +
      '<td class="n">' + p.lots + '</td>' +
      '<td class="n">' + (p.hasCost ? yen(p.unitCost) : '—') + '</td>' +
      '<td class="n">' + (p.hasCost ? yen(p.value) : '—') + '</td>' +
      '<td class="n">' + (p.dailyOut ? p.dailyOut.toFixed(1) : '—') + '</td>' +
      '<td class="n">' + dos + '</td>' +
      '<td>' + fmtDate(p.lastIn) + '</td>' +
      '<td>' + lastOut + '</td>' +
      '<td>' + expiry + '</td>' +
      '<td>' + statusBadge(p.status) + '</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="14" class="empty">対象データがありません</td></tr>';

  $('productFoot').innerHTML = arr.length
    ? '<tr><td>合計 ' + num(arr.length) + ' SKU</td><td>—</td>' +
      '<td class="n">' + num(sum(arr, function (p) { return p.stock; })) + '</td>' +
      '<td class="n">' + num(sum(arr, function (p) { return p.allocated; })) + '</td>' +
      '<td class="n">' + num(sum(arr, function (p) { return p.free; })) + '</td>' +
      '<td class="n">' + num(sum(arr, function (p) { return p.lots; })) + '</td>' +
      '<td class="n">—</td>' +
      '<td class="n">' + yen(sum(arr, function (p) { return p.value; })) + '</td>' +
      '<td class="n">' + sum(arr, function (p) { return p.dailyOut; }).toFixed(1) + '</td>' +
      '<td class="n">—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>'
    : '';

  $('productCount').textContent = '全 ' + num(arr.length) + ' SKU を表示（スクロール）';
}

function sortLots(arr) {
  var mode = $('lotSort').value;
  var copy = arr.slice();
  var far = function (v) { return v === null ? Infinity : v; };
  switch (mode) {
    case 'stock_desc': return copy.sort(function (a, b) { return b.stock - a.stock; });
    case 'arrived_asc': return copy.sort(function (a, b) { return (a.arrivedOn || '9999').localeCompare(b.arrivedOn || '9999'); });
    case 'lastout_asc': return copy.sort(function (a, b) { return (a.lastOut || '9999').localeCompare(b.lastOut || '9999'); });
    case 'product_asc': return copy.sort(function (a, b) {
      return a.product.localeCompare(b.product, 'ja') || (a.arrivedOn || '').localeCompare(b.arrivedOn || '');
    });
    default: return copy.sort(function (a, b) { return far(a.expiryDays) - far(b.expiryDays); });
  }
}

function renderLots(lots) {
  var arr = sortLots(lots);

  $('lotBody').innerHTML = arr.map(function (r) {
    var days = r.expiryDays === null ? '—'
      : '<span class="badge' + (r.expiryDays < 0 ? ' flag' : r.expiryDays <= TH.expirySoon ? '' : ' silver') + '">' +
        (r.expiryDays < 0 ? r.expiryDays + '日' : '残' + r.expiryDays + '日') + '</span>';
    return '<tr>' +
      '<td class="name" title="' + esc(r.product) + '">' + esc(shortName(r.product)) + '</td>' +
      '<td>' + esc(r.lotNo) + '</td>' +
      '<td>' + fmtDate(r.arrivedOn) + '</td>' +
      '<td>' + fmtDate(r.bestBefore) + '</td>' +
      '<td class="n">' + days + '</td>' +
      '<td class="n">' + num(r.stock) + '</td>' +
      '<td class="n">' + num(r.allocated) + '</td>' +
      '<td class="n">' + num(r.free) + '</td>' +
      '<td class="n">' + (r.hasCost ? yen(r.value) : '—') + '</td>' +
      '<td>' + fmtDate(r.lastIn) + '</td>' +
      '<td>' + fmtDate(r.lastOut) + '</td>' +
      '<td>' + esc(r.supplier) + '</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="12" class="empty">対象データがありません</td></tr>';

  $('lotFoot').innerHTML = arr.length
    ? '<tr><td>合計 ' + num(arr.length) + ' ロット</td><td>—</td><td>—</td><td>—</td><td class="n">—</td>' +
      '<td class="n">' + num(sum(arr, function (r) { return r.stock; })) + '</td>' +
      '<td class="n">' + num(sum(arr, function (r) { return r.allocated; })) + '</td>' +
      '<td class="n">' + num(sum(arr, function (r) { return r.free; })) + '</td>' +
      '<td class="n">' + yen(sum(arr, function (r) { return r.value; })) + '</td>' +
      '<td>—</td><td>—</td><td>—</td></tr>'
    : '';

  $('lotCount').textContent = '全 ' + num(arr.length) + ' ロットを表示（スクロール）';
}

// ---------------------------------------------------------------------------
// Render / events
// ---------------------------------------------------------------------------

function render() {
  var lots = currentLots();
  var products = productRows(lots);

  renderKpis(lots, products);
  renderValueChart(lots);
  renderDosChart(products);
  renderExpiryChart(lots);
  renderInsights(lots, products);
  renderProducts(products);
  renderLots(lots);
}

function bindEvents() {
  $('hideZero').addEventListener('change', render);
  $('productSort').addEventListener('change', function () { renderProducts(productRows(currentLots())); });
  $('lotSort').addEventListener('change', function () { renderLots(currentLots()); });
  $('reset').addEventListener('click', resetFilters);

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.multiSelect')) {
      document.querySelectorAll('.multiSelect.open').forEach(function (x) {
        x.classList.remove('open');
        x.querySelector('.multiTrigger').setAttribute('aria-expanded', 'false');
      });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.multiSelect.open').forEach(function (x) {
      x.classList.remove('open');
      x.querySelector('.multiTrigger').setAttribute('aria-expanded', 'false');
    });
  });
}

loadData();

})();
</script>
