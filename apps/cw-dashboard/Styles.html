<style>
/* ============================================================
   CRAFT WONDER DASHBOARD — Master UI
   ------------------------------------------------------------
   全ページ共通のデザインシステム。
   ページごとにこのファイルを書き換えないこと（引き継ぎ書 §22）。
   ============================================================ */

:root{
  /* --- Color（引き継ぎ書 §3） --- */
  --bg:#F5F5F6;
  --panel:#FFFFFF;
  --ink:#171717;
  --muted:#747474;
  --line:#D8D8D4;
  --gold:#B39A63;
  --goldDark:#8D7544;
  --goldSoft:#F1EDE4;
  --silver:#A8AAAD;
  --silverSoft:#EEEEEC;

  /* 状態表現。原色を避け、モノトーン＋ゴールドに馴染む彩度に抑える */
  --alert:#875D55;
  --alertSoft:#F3ECEA;

  /* --- Spacing（全ページ統一・引き継ぎ書 §22） --- */
  --gap:14px;
  --gapSm:10px;
  --pad:18px;
  --radius:10px;
  --radiusSm:6px;

  --shadow:0 4px 18px rgba(0,0,0,.045);
  --shadowMenu:0 10px 28px rgba(0,0,0,.10);

  /* --- Typography（引き継ぎ書 §4） --- */
  --font:Avenir,"Avenir Next","Yu Gothic","游ゴシック",YuGothic,sans-serif;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.app{max-width:1500px;margin:0 auto;padding:28px}

/* 数値は必ずAvenir・等幅数字で桁を揃える */
.num{font-family:var(--font);font-variant-numeric:tabular-nums}

/* ============================================================
   Header / Navigation（§7・§21）
   ============================================================ */
.header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #202020;position:relative}
.header:after{content:"";position:absolute;left:0;bottom:-1px;width:92px;height:2px;background:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:700;color:var(--gold);text-transform:uppercase}
h1{font-size:28px;margin:4px 0 3px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px}
.updated{font-size:12px;color:var(--muted);text-align:right;line-height:1.7}
.updated b{color:var(--ink);font-weight:700}

.nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.navGroup{display:flex;align-items:center;gap:4px;padding-right:12px;margin-right:8px;border-right:1px solid var(--line)}
.navGroup:last-child{border-right:0;margin-right:0;padding-right:0}
.navGroup > span{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;text-transform:uppercase;margin-right:2px}
.navItem{height:30px;display:inline-flex;align-items:center;padding:0 11px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:var(--radiusSm);text-decoration:none;white-space:nowrap}
.navItem:hover{background:var(--silverSoft);color:var(--ink)}
.navItem.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);font-weight:700}
.navItem.soon{opacity:.5;cursor:not-allowed}

/* ============================================================
   Filter Area（§9・§10）
   ============================================================ */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow);margin-bottom:16px}
.field label{font-size:10px;color:var(--muted);display:block;margin:0 0 5px}
select,input{width:100%;height:40px;border:1px solid var(--line);background:#fff;border-radius:var(--radiusSm);padding:0 10px;color:var(--ink);font-size:13px;font-family:inherit}
select:focus,input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 2px rgba(179,154,99,.10)}
button{border:0;border-radius:var(--radiusSm);padding:0 14px;height:40px;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;align-self:end;font-family:inherit;font-size:13px}
button.secondary{background:var(--silverSoft);color:var(--ink);border:1px solid var(--line)}
button.secondary:hover{background:#e4e4e1}

/* リセットは必ず右下（§9・§23） */
.filters .resetCell{display:flex;align-items:flex-end;grid-column:3}
.filters .resetCell button{width:100%}

.multiSelect{position:relative}
.multiTrigger{width:100%;height:40px;background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:var(--radiusSm)!important;padding:0 34px 0 10px!important;text-align:left;font-weight:500!important;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multiTrigger:after{content:"⌄";position:absolute;right:11px;top:8px;font-size:18px;color:var(--muted)}
.multiSelect.open .multiTrigger{border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(179,154,99,.10)}
.multiSelect.picked .multiTrigger{background:var(--goldSoft)!important;border-color:#e3d9c2!important}
.multiMenu{display:none;position:absolute;z-index:30;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadowMenu);padding:8px;max-height:280px;overflow:auto}
.multiSelect.open .multiMenu{display:block}
.multiMenuHead{display:flex;gap:6px;padding:3px 3px 8px;border-bottom:1px solid var(--silverSoft);margin-bottom:5px;position:sticky;top:-8px;background:#fff}
.multiMini{height:28px!important;padding:0 8px!important;font-size:10px!important;background:var(--silverSoft)!important;color:var(--ink)!important;border:1px solid var(--line)!important;font-weight:700!important}
.multiSearch{height:30px!important;font-size:11px!important;flex:1;min-width:0}
.multiOption{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:5px;font-size:12px;line-height:1.35;cursor:pointer}
.multiOption:hover{background:#f6f6f5}
.multiOption.on{background:var(--goldSoft)}
.multiOption input{width:15px;height:15px;flex:0 0 auto;margin-top:1px;accent-color:var(--goldDark)}
.multiOption .optCount{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px}
.multiCount{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--goldSoft);color:var(--goldDark);font-size:10px;font-weight:800}

/* ============================================================
   KPI Cards（§11）
   ============================================================ */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gapSm);margin-bottom:var(--gap)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:15px 16px;min-width:0}
.kpi .label{font-size:11px;color:var(--muted)}
.kpi .value{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:8px 0 4px;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.kpi.accent .value{color:var(--goldDark)}
.kpi .note{font-size:10px;color:var(--muted);line-height:1.5}
.kpi .delta{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;background:var(--silverSoft);color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.kpi .delta.up{background:var(--goldSoft);color:var(--goldDark)}
.kpi .delta.down{background:var(--alertSoft);color:var(--alert)}

/* ============================================================
   Panel / Section 見出し（§8）
   ============================================================ */
.panel{padding:var(--pad)}
.panelHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap}
.panelHead h2{font-size:15px;margin:3px 0 0;letter-spacing:-.01em}
.kicker{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.kicker.gold{color:var(--gold)}
.hint{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}

.legend{display:flex;gap:12px;color:var(--muted);font-size:11px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.gold{background:var(--gold)}
.dot.goldDark{background:var(--goldDark)}
.dot.silver{background:var(--silver)}
.dot.ink{background:var(--ink)}
.dot.soft{background:var(--goldSoft);border:1px solid #e3d9c2}
.dot.line{width:14px;height:0;border-top:2px dashed var(--silver);border-radius:0;margin-bottom:3px}

/* 操作UIは各パネル右上（§22） */
.sortTools{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sortTools label{font-size:10px;color:var(--muted)}
.sortTools select{display:block;margin-top:4px;height:34px;min-width:170px;font-size:11px}

/* ============================================================
   Tabs（§13）
   ============================================================ */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:34px;padding:0 11px;background:#fff;color:var(--muted);border:1px solid var(--line);font-size:12px;border-radius:5px;font-weight:500}
.tab:hover{background:var(--silverSoft);color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);font-weight:700}
.tab.sm{height:28px;padding:0 9px;font-size:11px}

/* ============================================================
   Layout grids
   ============================================================ */
/* align-items:start — 隣のパネルの高さに引きずられてグラフ下に空白が出るのを防ぐ */
.grid2{display:grid;grid-template-columns:1.5fr .9fr;gap:var(--gap);margin-bottom:var(--gap);align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.gridMain{display:grid;grid-template-columns:1.2fr .8fr;gap:var(--gap);margin-bottom:var(--gap)}
.stack{margin-bottom:var(--gap)}

/* ============================================================
   Charts（§12）
   ============================================================ */
.chart{width:100%;display:block}
#trend{height:300px}
.chartSm{height:230px}
.chartTools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ============================================================
   Operating Signals
   ============================================================ */
.insights{display:grid;gap:var(--gapSm)}
.insight{border:1px solid var(--line);border-radius:var(--radius);padding:13px;background:#fafafa}
.insight.flag{border-color:#e0d3ce;background:var(--alertSoft)}
.insight b{display:block;font-size:13px;margin-bottom:5px}
.insight p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.insight .metric{font-weight:800;color:var(--goldDark);font-variant-numeric:tabular-nums}
.insight.flag .metric{color:var(--alert)}

.followList{display:grid;gap:9px;max-height:470px;overflow:auto}
.follow{padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.followTop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.follow b{font-size:12px}
.follow .days{font-weight:800;color:var(--goldDark);font-variant-numeric:tabular-nums;white-space:nowrap}
.follow.hot .days{color:var(--alert)}
.follow small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.6}

/* ============================================================
   Rank list（Breakdown §14）
   ============================================================ */
.rankList{display:grid;gap:9px;max-height:420px;overflow:auto;padding-right:2px}
.rankRow{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(160px,2fr) 110px;gap:12px;align-items:center;font-size:12px}
.rankName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankSub{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.track{height:10px;background:var(--silverSoft);border-radius:20px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--goldDark),var(--gold));border-radius:20px}
.fill.silver{background:var(--silver)}
.rankValue{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ============================================================
   Table 共通（§15）
   ============================================================ */
.tableWrap{overflow:auto;max-height:520px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
th{text-align:left;color:var(--muted);font-size:10px;font-weight:700;position:sticky;top:0;background:#fff;padding:10px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--silverSoft);white-space:nowrap;vertical-align:top}
tbody tr:hover td{background:#fafaf9}
td.name{max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-weight:600}
tfoot td{position:sticky;bottom:0;background:#f7f7f6;border-top:1px solid var(--line);font-weight:800}

.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:var(--goldSoft);color:var(--goldDark);font-size:10px;font-weight:700;border:1px solid #e5dcc8;white-space:nowrap}
.badge.silver{background:var(--silverSoft);color:var(--muted);border-color:var(--line)}
.badge.flag{background:var(--alertSoft);color:var(--alert);border-color:#e0d3ce}

.rowCount{font-size:10px;color:var(--muted);margin-top:8px;text-align:right;font-variant-numeric:tabular-nums}

.productQtyCell{min-width:260px;white-space:normal!important}
.productChips{display:flex;flex-wrap:wrap;gap:5px}
.productChip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid #e4dece;background:#faf8f3;border-radius:var(--radiusSm);font-size:10px;line-height:1.3;color:var(--ink)}
.productChip b{color:var(--goldDark);font-size:11px;font-variant-numeric:tabular-nums}
.productChip.silver{border-color:var(--line);background:#f8f8f7}
.productChip.silver b{color:var(--muted)}

/* 店舗 × 商品（§17）— 区分は2段ヘッダーで列展開 */
.detailTable td.name2{max-width:460px;white-space:normal;line-height:1.45}
.detailTable thead tr:first-child th{background:#f7f7f7;text-align:center;border-bottom:1px solid #bdbdbd}
.detailTable thead tr:first-child th[rowspan]{text-align:left;vertical-align:bottom;background:#fff}
.detailTable thead tr:nth-child(2) th{text-align:right;background:#fbfbfb;top:33px}
.detailTable .segmentGroup{font-size:11px;letter-spacing:.04em;color:var(--ink);border-left:1px solid var(--line)}
.detailTable .segmentSub{font-size:10px;color:var(--muted);border-left:1px solid var(--line)}
.detailTable td.segQty,.detailTable td.segSales{text-align:right;font-variant-numeric:tabular-nums;border-left:1px solid #ecece9}
.detailTable td.segQty{font-weight:800}
.detailTable td.segSales{color:var(--goldDark)}
.detailTable td.zero{color:#b4b4b4;font-weight:400}

.empty{color:var(--muted);font-size:12px;padding:30px;text-align:center}
.footer{font-size:11px;color:var(--muted);margin:18px 2px 0;line-height:1.75}
.footer b{color:var(--ink)}

.loading{padding:60px;text-align:center;color:var(--muted);font-size:13px}
.errorBox{margin:20px 0;padding:16px 18px;border:1px solid #e0d3ce;background:var(--alertSoft);border-radius:var(--radius);color:var(--alert);font-size:12px;line-height:1.7}
.errorBox b{display:block;margin-bottom:6px;font-size:13px}

/* 原価の出所を明示するバナー。サンプル原価のまま実績と誤読されるのを防ぐ。 */
.noticeBox{margin:0 0 var(--gap);padding:12px 16px;border:1px solid #e3d9c2;background:var(--goldSoft);border-radius:var(--radius);color:var(--goldDark);font-size:12px;line-height:1.7}
.noticeBox b{font-weight:800}
.noticeBox.warn{border-color:#e0d3ce;background:var(--alertSoft);color:var(--alert)}

/* ============================================================
   Responsive（§20）— 情報量は削減しない。列は横スクロールで担保する
   ============================================================ */
@media(max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:1100px){
  .grid2,.gridMain{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .grid3{grid-template-columns:1fr}
}
@media(max-width:700px){
  .app{padding:14px}
  .header{align-items:flex-start;flex-direction:column}
  .updated{text-align:left}
  .filters{grid-template-columns:1fr 1fr;gap:12px}
  .filters .resetCell{grid-column:2}
  .kpis{grid-template-columns:1fr 1fr}
  .rankRow{grid-template-columns:1fr 100px}
  .rankRow .track{grid-column:1/-1}
  .nav{gap:6px}
  .navGroup{border-right:0;padding-right:0;margin-right:0}
}
@media(max-width:460px){
  .filters{grid-template-columns:1fr}
  .filters .resetCell{grid-column:1}
  .sortTools{width:100%}
  .sortTools label,.sortTools select{width:100%;min-width:0}
}
</style>
